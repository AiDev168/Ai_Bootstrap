name: One-time runtime finalize v2

on:
  push:
    branches:
      - feature/step32-final-validation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install project tooling
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Anchor not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/ai_engineering_bootstrap/pipeline/engine.py",
              "        return True\n\n\nclass PipelineEngine:",
              '''        return True\n\n    @property\n    def action_successful(self) -> bool:\n        if self.execution_result is None or not self.validation_result.is_valid:\n            return False\n        if self.is_pending_approval or self.is_rejected_approval:\n            return False\n        if not self.execution_result.is_success:\n            return False\n        return not any(\n            getattr(item, "status", None).value == "failed"\n            for item in (self.verification_result or [])\n        )\n\n\nclass PipelineEngine:''',
          )

          replace_once(
              "src/ai_engineering_bootstrap/bootstrap/service.py",
              "    @property\n    def is_success(self) -> bool:\n",
              '''    @property\n    def requested_actions_successful(self) -> bool:\n        return all(result.is_success for result in self.action_results)\n\n    @property\n    def is_success(self) -> bool:\n''',
          )
          replace_once(
              "src/ai_engineering_bootstrap/bootstrap/service.py",
              "            if not result.is_success:\n                break\n",
              "            if not result.action_successful:\n                break\n",
          )

          replace_once(
              "src/ai_engineering_bootstrap/backend/session_service.py",
              "                        error=None\n                        if action_result.status.value == \"success\"\n                        else action_result.message,\n                    )",
              "                        error=None\n                        if action_result.status.value == \"success\"\n                        else action_result.message,\n                        artifacts=dict(action_result.details),\n                    )",
          )
          replace_once(
              "src/ai_engineering_bootstrap/backend/session_service.py",
              "        session.status = (\n            SessionStatus.COMPLETED if result.is_success else SessionStatus.FAILED\n        )",
              '''        requested_actions_successful = result.requested_actions_successful\n        session.status = (\n            SessionStatus.COMPLETED\n            if requested_actions_successful\n            else SessionStatus.FAILED\n        )''',
          )
          replace_once(
              "src/ai_engineering_bootstrap/backend/session_service.py",
              '            "session_completed" if result.is_success else "session_failed",',
              '            "session_completed" if requested_actions_successful else "session_failed",',
          )
          replace_once(
              "src/ai_engineering_bootstrap/backend/session_service.py",
              '            "Session execution completed."\n            if result.is_success\n            else "Session execution failed.",',
              '            "Requested installation actions completed successfully."\n            if requested_actions_successful\n            else "One or more requested actions failed during execution.",',
          )
          replace_once(
              "src/ai_engineering_bootstrap/backend/session_service.py",
              '                "environment_ready": result.environment_ready,\n                "excluded_actions": excluded_actions,',
              '                "environment_ready": result.environment_ready,\n                "requested_actions_successful": requested_actions_successful,\n                "excluded_actions": excluded_actions,',
          )
          replace_once(
              "src/ai_engineering_bootstrap/backend/session_service.py",
              '            "session_id": session.session_id,\n            "status": session.status.value,',
              '''            "session_id": session.session_id,\n            "label": session.request.natural_language_goal.strip()\n            if session.request and session.request.natural_language_goal.strip()\n            else "Environment Bootstrap",\n            "status": session.status.value,''',
          )

          llm = Path("src/ai_engineering_bootstrap/backend/llm_settings.py")
          text = llm.read_text(encoding="utf-8")
          text = text.replace("from pathlib import Path\n", "from datetime import UTC, datetime\nfrom pathlib import Path\n", 1)
          text = text.replace('    enabled: bool = False\n', '    enabled: bool = False\n    connection_ok: bool | None = None\n    connection_message: str = "Not tested yet."\n    last_test_at: str | None = None\n', 1)
          text = text.replace('        self.store = store or LLMSettingsStore()\n', '        self.store = store or LLMSettingsStore()\n        self._last_probe: dict[str, Any] | None = None\n', 1)
          text = text.replace('        enabled = provider != "mock" and bool(model or base_url)\n', '        enabled = provider == "mock" or bool(model or base_url)\n', 1)
          old = '''        return LLMSettings(\n            provider=provider,\n            model=model,\n            base_url=base_url,\n            api_key_configured=bool(api_key),\n            enabled=enabled,\n        )'''
          new = '''        probe = self._last_probe\n        connection_ok = None\n        connection_message = "Not tested yet."\n        last_test_at = None\n        if probe and probe.get("fingerprint") == self._fingerprint(values):\n            connection_ok = bool(probe.get("ok"))\n            connection_message = str(probe.get("message", ""))\n            last_test_at = probe.get("tested_at")\n        return LLMSettings(\n            provider=provider,\n            model=model,\n            base_url=base_url,\n            api_key_configured=bool(api_key),\n            enabled=enabled,\n            connection_ok=connection_ok,\n            connection_message=connection_message,\n            last_test_at=last_test_at,\n        )'''
          replace_once("src/ai_engineering_bootstrap/backend/llm_settings.py", old, new)
          old = '''    def update(self, payload: dict[str, Any]) -> LLMSettings:\n        current = self.store.load()\n        values = self._normalize_values(payload, current)\n        self.store.save(values)\n        return self.get()'''
          new = '''    @staticmethod\n    def _fingerprint(values: dict[str, str]) -> tuple[str, str, str, bool]:\n        return (values.get("provider", DEFAULT_PROVIDER), values.get("model", ""), values.get("base_url", ""), bool(values.get("api_key", "")))\n\n    def _record_probe(self, values: dict[str, str], result: dict[str, Any]) -> dict[str, Any]:\n        self._last_probe = {"fingerprint": self._fingerprint(values), "ok": bool(result.get("ok")), "message": str(result.get("message", "")), "tested_at": datetime.now(UTC).isoformat()}\n        return result\n\n    def update(self, payload: dict[str, Any]) -> LLMSettings:\n        current = self.store.load()\n        values = self._normalize_values(payload, current)\n        self.store.save(values)\n        self._last_probe = None\n        return self.get()'''
          replace_once("src/ai_engineering_bootstrap/backend/llm_settings.py", old, new)
          replace_once(
              "src/ai_engineering_bootstrap/backend/llm_settings.py",
              '        if provider == "mock":\n            return {\n                "ok": False,\n                "provider": provider,\n                "message": "Mock provider is test-only and is not a runtime LLM.",\n            }',
              '        if provider == "mock":\n            return self._record_probe(values, {"ok": True, "provider": provider, "message": "Mock provider is available offline."})',
          )
          llm.write_text(text, encoding="utf-8")

          backend = Path("src/ai_engineering_bootstrap/backend/service.py")
          text = backend.read_text(encoding="utf-8")
          text = text.replace('"llm_available": settings.enabled,', '"llm_available": settings.connection_ok is True,', 1)
          text = text.replace('                    "enabled": settings.enabled,\n', '                    "enabled": settings.enabled,\n                    "connection_ok": settings.connection_ok,\n                    "connection_message": settings.connection_message,\n                    "last_test_at": settings.last_test_at,\n', 1)
          backend.write_text(text, encoding="utf-8")

          test = Path("tests/unit/test_gui_backend_contract.py")
          text = test.read_text(encoding="utf-8")
          text = text.replace('from ai_engineering_bootstrap.backend.service import ApplicationBackend\n', 'from types import SimpleNamespace\n\nfrom ai_engineering_bootstrap.backend.service import ApplicationBackend\nfrom ai_engineering_bootstrap.backend.session_service import EnvironmentSessionService\nfrom ai_engineering_bootstrap.environment.session_repository import InMemorySessionRepository\n', 1)
          text = text.replace('def test_session_endpoints_return_serializable_data() -> None:\n    backend = ApplicationBackend()\n', 'def test_session_endpoints_return_serializable_data() -> None:\n    service = EnvironmentSessionService(repository=InMemorySessionRepository(), audit_factory=lambda: SimpleNamespace(checks=[]))\n    backend = ApplicationBackend(session_service=service)\n', 1)
          test.write_text(text, encoding="utf-8")

          runtime = Path("src/ai_engineering_bootstrap/gui/static/app-runtime.js")
          runtime.write_text(runtime.read_text(encoding="utf-8") + '''\n\n(() => {\n    const consoleLog = document.getElementById("request-log");\n    const latest = document.getElementById("latest");\n    const toolbar = document.querySelector("#console .toolbar");\n    let paused = false;\n    let snapshot = null;\n    let filter = "ALL";\n    const refresh = () => {\n        if (consoleLog) {\n            for (const item of consoleLog.querySelectorAll(".request")) {\n                const method = item.querySelector("strong")?.textContent?.trim() || "";\n                const error = item.classList.contains("bad");\n                item.style.display = filter === "ALL" || method === filter || (filter === "ERROR" && error) ? "block" : "none";\n            }\n        }\n        if (latest) {\n            const last = consoleLog?.querySelector(".request");\n            latest.classList.toggle("error-box", Boolean(last?.classList.contains("bad")));\n            if (paused && snapshot !== null && latest.textContent !== snapshot) latest.textContent = snapshot;\n        }\n    };\n    if (toolbar && !toolbar.querySelector("#request-filter")) {\n        const controls = document.createElement("span");\n        controls.innerHTML = '<select id="request-filter"><option value="ALL">All</option><option value="GET">GET</option><option value="POST">POST</option><option value="ERROR">Errors</option></select><button id="pause-latest" class="secondary" type="button">Pause</button>';\n        toolbar.appendChild(controls);\n        document.getElementById("request-filter")?.addEventListener("change", event => { filter = event.target.value; refresh(); });\n        document.getElementById("pause-latest")?.addEventListener("click", event => { paused = !paused; snapshot = paused ? (latest?.textContent || "") : null; event.target.textContent = paused ? "Resume" : "Pause"; refresh(); });\n    }\n    const observer = new MutationObserver(refresh);\n    if (consoleLog) observer.observe(consoleLog, {childList: true, subtree: true});\n    if (latest) observer.observe(latest, {childList: true, characterData: true, subtree: true});\n    refresh();\n})();\n''', encoding="utf-8")
          PY
      - name: Format
        run: python -m ruff format .
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Targeted tests
        run: pytest -q tests/unit/test_gui_backend_contract.py tests/unit/test_runtime_session_service.py tests/unit/test_step32_installation_intent.py
      - name: Full regression
        run: pytest -q
      - name: Diff check
        run: git diff --check
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/one-time-runtime-finalize-v2.yml
          git rm .github/workflows/one-time-runtime-finalize-v2.yml
          git commit -m "chore: finalize step32 runtime fixes v2 [skip ci]"
          git push
