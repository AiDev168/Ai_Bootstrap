name: Step32 runtime delivery

on:
  push:
    branches:
      - feature/step32-final-validation

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Patch session outcome and GUI diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path("src/ai_engineering_bootstrap/backend/session_service.py")
          text = service.read_text(encoding="utf-8")
          old = '''                session.add_execution_evidence(\n                    ExecutionEvidence(\n                        action_id=action_result.action_id,\n                        success=action_result.status.value == "success",\n                        output=action_result.message,\n                        error=None\n                        if action_result.status.value == "success"\n                        else action_result.message,\n                    )\n                )'''
          new = '''                session.add_execution_evidence(\n                    ExecutionEvidence(\n                        action_id=action_result.action_id,\n                        success=action_result.status.value == "success",\n                        output=action_result.message,\n                        error=None\n                        if action_result.status.value == "success"\n                        else action_result.message,\n                        artifacts=dict(action_result.details),\n                    )\n                )'''
          if old not in text:
              raise SystemExit("execution evidence block not found")
          text = text.replace(old, new, 1)

          old = '''        session.status = (\n            SessionStatus.COMPLETED if result.is_success else SessionStatus.FAILED\n        )\n        session.completed_at = utcnow()\n        session.add_event(\n            "session_completed" if result.is_success else "session_failed",\n            "Session execution completed."\n            if result.is_success\n            else "Session execution failed.",\n            {\n                "environment_ready": result.environment_ready,\n                "excluded_actions": excluded_actions,\n            },\n        )'''
          new = '''        execution_states = [\n            execution.is_success for execution in result.action_results\n        ]\n        execution_succeeded = bool(execution_states) and all(execution_states)\n        session_success = execution_succeeded and not result.rejected_actions\n        session.status = (\n            SessionStatus.COMPLETED if session_success else SessionStatus.FAILED\n        )\n        session.completed_at = utcnow()\n        if session_success and not result.environment_ready:\n            session.add_event(\n                "environment_not_ready",\n                "Requested actions completed, but unrelated environment checks remain unresolved.",\n                {"environment_ready": result.environment_ready},\n            )\n        session.add_event(\n            "session_completed" if session_success else "session_failed",\n            "Requested installation actions completed successfully."\n            if session_success\n            else "Session execution failed.",\n            {\n                "environment_ready": result.environment_ready,\n                "executed_actions": [action.action_id for action in execution_actions],\n                "excluded_actions": excluded_actions,\n            },\n        )'''
          if old not in text:
              raise SystemExit("session outcome block not found")
          text = text.replace(old, new, 1)

          old = '''            "session_id": session.session_id,\n            "status": session.status.value,\n            "created_at": session.created_at.isoformat(),\n            "updated_at": session.updated_at.isoformat(),'''
          new = '''            "session_id": session.session_id,\n            "label": session.request.natural_language_goal.strip()\n            if session.request and session.request.natural_language_goal.strip()\n            else "Environment Bootstrap",\n            "status": session.status.value,\n            "created_at": session.created_at.isoformat(),\n            "updated_at": session.updated_at.isoformat(),'''
          if old not in text:
              raise SystemExit("session summary block not found")
          text = text.replace(old, new, 1)
          service.write_text(text, encoding="utf-8")

          runtime = Path("src/ai_engineering_bootstrap/gui/static/app-runtime.js")
          text = runtime.read_text(encoding="utf-8")
          old = '''    function renderExecutionHistory(session) {\n        const detail = document.getElementById("session-detail");\n        if (!detail) return;\n        let card = detail.querySelector("[data-execution-evidence]");\n        if (!card) {\n            card = document.createElement("div");\n            card.dataset.executionEvidence = "1";\n            card.className = "card";\n            detail.appendChild(card);\n        }\n        const history = session?.execution_history || [];\n        const rows = history.map(item => {\n            const status = item.success ? "success" : "failed";\n            return `<div class="event ${status}"><strong>${item.action_id}</strong><br><span>${item.output || item.error || "No execution message."}</span><br><small>${item.timestamp || ""}</small></div>`;\n        }).join("");\n        card.innerHTML = `<h3>Execution Evidence</h3>${rows || '<div class="muted">No execution evidence recorded yet.</div>'}`;\n    }'''
          new = '''    function renderExecutionHistory(session) {\n        const detail = document.getElementById("session-detail");\n        if (!detail) return;\n        let card = detail.querySelector("[data-execution-evidence]");\n        if (!card) {\n            card = document.createElement("div");\n            card.dataset.executionEvidence = "1";\n            card.className = "card";\n            detail.appendChild(card);\n        }\n        const history = session?.execution_history || [];\n        const rows = history.map(item => {\n            const status = item.success ? "success" : "failed";\n            const label = String(item.action_id || "Action").replace(/^install_python_package:/, "Install Python package: ");\n            const details = item.artifacts || {};\n            const diagnostic = details.output || details.error || "";\n            return `<div class="event ${status}"><strong>${label}</strong><br><span>${item.output || item.error || "No execution message."}</span>${diagnostic ? `<pre style="margin-top:8px">${diagnostic}</pre>` : ""}<br><small>${item.timestamp || ""}</small></div>`;\n        }).join("");\n        card.innerHTML = `<h3>Execution Evidence</h3>${rows || '<div class="muted">No execution evidence recorded yet.</div>'}`;\n    }\n\n    function renderSessionLabel(session) {\n        const detail = document.getElementById("session-detail");\n        if (!detail) return;\n        const label = session?.label || session?.request?.natural_language_goal || "Environment Bootstrap";\n        const heading = [...detail.querySelectorAll("h2,h3")].find(node => /^Session\\s/i.test(node.textContent.trim()));\n        if (heading) heading.textContent = label;\n    }'''
          if old not in text:
              raise SystemExit("execution history block not found")
          text = text.replace(old, new, 1)

          old = '''        originalRenderSession(session, stateData, plan, events, decisions);\n        annotateNoWork(plan);'''
          new = '''        originalRenderSession(session, stateData, plan, events, decisions);\n        renderSessionLabel(session);\n        annotateNoWork(plan);'''
          if old not in text:
              raise SystemExit("renderSession block not found")
          text = text.replace(old, new, 1)
          runtime.write_text(text, encoding="utf-8")
          PY

      - name: Add regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path("tests/unit/test_runtime_session_service.py")
          text = test.read_text(encoding="utf-8")
          if "test_successful_requested_action_is_completed_even_if_environment_not_ready" not in text:
              text += '''\n\ndef test_successful_requested_action_is_completed_even_if_environment_not_ready() -> None:\n    """A successful requested action should not be marked failed by unrelated audit gaps."""\n    from types import SimpleNamespace\n\n    from ai_engineering_bootstrap.environment.models import EnvironmentRequest\n\n    class FakeAudit:\n        def run(self):\n            return SimpleNamespace(checks=[])\n\n    service = RuntimeSessionService(\n        repository=InMemorySessionRepository(),\n        audit_factory=FakeAudit,\n    )\n    request = EnvironmentRequest(required_tools=["ruff"], constraints={"force_install": True})\n    result = service.create(request)\n    assert result.data["status"] == "created"\n'''
          test.write_text(text, encoding="utf-8")
          PY

      - name: Lint and test
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m compileall -q src tests
          pytest -q

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/step32-runtime-delivery.yml
          git rm .github/workflows/step32-runtime-delivery.yml
          git commit -m "fix: complete requested action execution and session diagnostics [skip ci]"
          git push
