name: Step32 runtime GUI fixer

on:
  push:
    branches:
      - feature/step32-final-validation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install project tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply runtime and GUI fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Dashboard LLM health must mean a successful connection probe, not merely enabled configuration.
          replace_once(
              "src/ai_engineering_bootstrap/backend/service.py",
              '"llm_available": settings.enabled,\n                "llm": {',
              '"llm_available": settings.connection_ok is True,\n                "llm": {',
          )
          replace_once(
              "src/ai_engineering_bootstrap/backend/service.py",
              '"enabled": settings.enabled,\n                },',
              '"enabled": settings.enabled,\n                    "connection_ok": settings.connection_ok,\n                    "connection_message": settings.connection_message,\n                },',
          )
          replace_once(
              "src/ai_engineering_bootstrap/backend/service.py",
              '"enabled": settings.enabled,\n            }',
              '"enabled": settings.enabled,\n                "connection_ok": settings.connection_ok,\n                "connection_message": settings.connection_message,\n            }',
          )

          # Targeted sessions must not fail merely because the entire machine is not development-ready.
          p = Path("src/ai_engineering_bootstrap/bootstrap/service.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              '    action_results: tuple[ExecutionResult, ...] = field(default_factory=tuple)\n    rejected_actions: tuple[str, ...] = field(default_factory=tuple)\n',
              '    action_results: tuple[ExecutionResult, ...] = field(default_factory=tuple)\n    verification_results: tuple[tuple[object, ...], ...] = field(default_factory=tuple)\n    rejected_actions: tuple[str, ...] = field(default_factory=tuple)\n',
              1,
          )
          marker = '    @property\n    def is_success(self) -> bool:\n'
          insert = '''    @property\n    def targeted_success(self) -> bool:\n        """Return whether the explicitly executed actions succeeded and verified."""\n        if not self.action_results:\n            return False\n        if not all(result.is_success for result in self.action_results):\n            return False\n        for results in self.verification_results:\n            if any(getattr(item.status, "value", None) == "failed" for item in results):\n                return False\n        return True\n\n'''
          if marker not in text:
              raise SystemExit("BootstrapResult marker not found")
          text = text.replace(marker, insert + marker, 1)
          text = text.replace(
              '        action_results: list[ExecutionResult] = []\n        rejected: list[str] = []\n',
              '        action_results: list[ExecutionResult] = []\n        verification_history: list[tuple[object, ...]] = []\n        rejected: list[str] = []\n',
              1,
          )
          text = text.replace(
              '            if result.execution_result is not None:\n                action_results.append(result.execution_result)\n',
              '            if result.execution_result is not None:\n                action_results.append(result.execution_result)\n            if result.verification_result is not None:\n                verification_history.append(tuple(result.verification_result))\n',
              1,
          )
          text = text.replace(
              '            tuple(action_results),\n            tuple(rejected),\n        )\n',
              '            tuple(action_results),\n            tuple(verification_history),\n            tuple(rejected),\n        )\n',
              1,
          )
          p.write_text(text, encoding="utf-8")

          # Use targeted_success for GUI sessions and expose failure evidence.
          p = Path("src/ai_engineering_bootstrap/backend/session_service.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              '        session.status = (\n            SessionStatus.COMPLETED if result.is_success else SessionStatus.FAILED\n        )\n',
              '        targeted_success = result.targeted_success\n        session.status = (\n            SessionStatus.COMPLETED if targeted_success else SessionStatus.FAILED\n        )\n',
              1,
          )
          text = text.replace(
              '        session.add_event(\n            "session_completed" if result.is_success else "session_failed",\n            "Session execution completed."\n            if result.is_success\n            else "Session execution failed.",\n            {\n                "environment_ready": result.environment_ready,\n                "excluded_actions": excluded_actions,\n            },\n        )\n',
              '''        execution_evidence = [\n            {\n                "action_id": item.action_id,\n                "status": item.status.value,\n                "message": item.message,\n                "details": dict(item.details),\n            }\n            for execution in result.action_results\n            for item in execution.results\n        ]\n        verification_evidence = [\n            {\n                "action_id": item.action_id,\n                "status": item.status.value,\n                "message": item.message,\n                "expected": item.expected,\n                "observed": item.observed,\n                "details": dict(item.details),\n            }\n            for results in result.verification_results\n            for item in results\n        ]\n        session.add_event(\n            "session_completed" if targeted_success else "session_failed",\n            "Session execution completed."\n            if targeted_success\n            else "Session execution failed.",\n            {\n                "environment_ready": result.environment_ready,\n                "targeted_success": targeted_success,\n                "excluded_actions": excluded_actions,\n                "execution": execution_evidence,\n                "verification": verification_evidence,\n            },\n        )\n''',
              1,
          )
          text = text.replace(
              '                "environment_ready": result.environment_ready,\n                "rejected_actions": excluded_actions + list(result.rejected_actions),\n',
              '                "environment_ready": result.environment_ready,\n                "targeted_success": targeted_success,\n                "execution": execution_evidence,\n                "verification": verification_evidence,\n                "rejected_actions": excluded_actions + list(result.rejected_actions),\n',
              1,
          )
          p.write_text(text, encoding="utf-8")

          # GUI: request console filter/pause, real LLM probe, model editability, and execution evidence.
          p = Path("src/ai_engineering_bootstrap/gui/static/index.html")
          text = p.read_text(encoding="utf-8")
          replace_once(
              str(p),
              '<section id="console" class="panel"><div class="grid2"><div class="card"><div class="toolbar"><h3>Request Console</h3><button class="secondary" onclick="clearLog()">Clear</button></div><div id="request-log" class="console"><div class="muted">No requests yet.</div></div></div><div class="card"><h3>Latest Response</h3><pre id="latest">—</pre></div></div></section>',
              '<section id="console" class="panel"><div class="grid2"><div class="card"><div class="toolbar"><h3>Request Console</h3><div class="actions"><select id="request-filter" onchange="setRequestFilter(this.value)" style="width:auto"><option value="ALL">All</option><option value="GET">GET</option><option value="POST">POST</option><option value="ERROR">Errors</option></select><button class="secondary" onclick="clearLog()">Clear</button></div></div><div id="request-log" class="console"><div class="muted">No requests yet.</div></div></div><div class="card"><div class="toolbar"><h3>Latest Response</h3><button class="secondary" id="latest-pause" onclick="toggleLatestPause()">Pause</button></div><pre id="latest">—</pre></div></div></section>',
          )
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              'const state={sessionId:null,timer:null,requests:[]};',
              'const state={sessionId:null,timer:null,requests:[],latestPaused:false,requestFilter:"ALL"};',
              1,
          )
          text = text.replace(
              'function renderLog(){const e=$(\'request-log\');if(!state.requests.length){e.innerHTML=\'<div class="muted">No requests yet.</div>\';return}e.innerHTML=state.requests.map(r=>`<div class="request ${r.status>=200&&r.status<300?\'ok\':r.status===0?\'busy\':\'bad\'}"><strong>${r.method}</strong> ${r.path}<div class="small">${r.status||\'network\'} • ${r.ms}ms • ${r.time}</div></div>`).join(\'\')}\nfunction logRequest(method,path,status,ms,response){state.requests.unshift({method,path,status,ms,time:new Date().toLocaleTimeString()});state.requests=state.requests.slice(0,80);renderLog();$(\'latest\').textContent=JSON.stringify(response,null,2)}',
              '''function renderLog(){const e=$(\'request-log\');const rows=state.requests.filter(r=>state.requestFilter===\'ALL\'||(state.requestFilter===\'ERROR\'?!(r.status>=200&&r.status<300):r.method===state.requestFilter));if(!rows.length){e.innerHTML=\'<div class="muted">No matching requests.</div>\';return}e.innerHTML=rows.map(r=>`<div class="request ${r.status>=200&&r.status<300?\'ok\':r.status===0?\'busy\':\'bad\'}"><strong>${r.method}</strong> ${r.path}<div class="small">${r.status||\'network\'} • ${r.ms}ms • ${r.time}</div></div>`).join(\'\')}\nfunction setRequestFilter(value){state.requestFilter=value;renderLog()}\nfunction toggleLatestPause(){state.latestPaused=!state.latestPaused;$(\'latest-pause\').textContent=state.latestPaused?\'Resume\':\'Pause\'}\nfunction logRequest(method,path,status,ms,response){state.requests.unshift({method,path,status,ms,time:new Date().toLocaleTimeString()});state.requests=state.requests.slice(0,80);renderLog();if(!state.latestPaused)$(\'latest\').textContent=JSON.stringify(response,null,2)}''',
              1,
          )
          text = text.replace(
              "$('llm').innerHTML=badge(x.llm_available);",
              "$('llm').innerHTML=badge(x.llm_available);",
              1,
          )
          text = text.replace(
              "<p><strong>API key:</strong> ${badge(l.api_key_configured)}</p>`",
              "<p><strong>API key:</strong> ${badge(l.api_key_configured)}</p><p><strong>Connection:</strong> ${badge(l.connection_ok===true?'connected':l.connection_ok===false?'failed':'not tested')}</p><p>${l.connection_message||''}</p>`",
              1,
          )
          text = text.replace(
              "async function testLlm(){const b=$('provider').value;try{const x=await api('/llm/test');",
              "async function testLlm(){try{const x=await api('/llm/test','POST',{provider:$('provider').value,model:$('model').value.trim(),base_url:$('base-url').value.trim(),api_key:$('api-key').value});",
              1,
          )
          text = text.replace(
              "$('base-url').disabled=mock;$('model').disabled=mock",
              "$('base-url').disabled=mock;$('model').disabled=false;$('api-key').disabled=false",
              1,
          )
          text = text.replace(
              "<label for=\"provider\">Provider</label><select id=\"provider\">",
              "<label for=\"provider\">Provider</label><select id=\"provider\" onchange=\"updateLlmFields()\">",
              1,
          )
          text = text.replace(
              "async function loadLlm(){",
              "function updateLlmFields(){const mock=$('provider').value==='mock';$('base-url').disabled=mock;$('model').disabled=false;$('api-key').disabled=false}\nasync function loadLlm(){",
              1,
          )
          text = text.replace(
              "async function refreshAll(){await Promise.all([refreshHealth(),loadAudit(),loadEngineering(),refreshSessionsMetric()])}",
              "async function refreshAll(){await Promise.all([refreshHealth(),loadAudit(),loadEngineering(),refreshSessionsMetric()])}",
              1,
          )
          # Add evidence rendering immediately before timeline rendering.
          needle = 'html+=`<div class="grid2" style="margin-top:14px"><div class="card"><h3>Timeline</h3>'
          replacement = '''const executionEvidence=session.execution_history||[];const failureEvents=(events.events||[]).filter(e=>e.event_type==='session_failed');html+=`<div class="card" style="margin-top:14px"><h3>Execution Evidence</h3>${executionEvidence.length?executionEvidence.map(e=>`<div class="action"><div class="action-head"><strong>${e.action_id}</strong>${badge(e.success?'success':'failed')}</div><div style="margin-top:6px">${e.output||e.error||'—'}</div><pre style="margin-top:8px">${JSON.stringify(e,null,2)}</pre></div>`).join(''):failureEvents.length?`<div class="error-box">${failureEvents.map(e=>e.message).join('<br>')}</div>`:'<div class="muted">No execution evidence yet.</div>'}</div></div>`;html+=`<div class="grid2" style="margin-top:14px"><div class="card"><h3>Timeline</h3>'''
          if needle not in text:
              raise SystemExit("Session timeline marker not found")
          text = text.replace(needle, replacement, 1)
          p.write_text(text, encoding="utf-8")

          # Add focused GUI/runtime regression tests.
          test_path = Path("tests/unit/test_llm_runtime_gui.py")
          test = test_path.read_text(encoding="utf-8")
          if "test_health_requires_successful_llm_probe" not in test:
              test += '''\n\ndef test_health_requires_successful_llm_probe(monkeypatch, tmp_path) -> None:\n    monkeypatch.setenv(LLMSettingsStore.ENV_FILE, str(tmp_path / "llm.json"))\n    backend = ApplicationBackend()\n    backend.update_llm_settings({"provider": "local_server", "model": "qwen", "base_url": "http://127.0.0.1:9/v1", "api_key": ""})\n    assert backend.health().data["llm_available"] is False\n'''
          test_path.write_text(test, encoding="utf-8")
          PY
      - name: Validate
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m compileall -q src tests
          pytest -q
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/step32-runtime-gui-fix.yml
          git rm .github/workflows/step32-runtime-gui-fix.yml
          git commit -m "fix: harden gui observability and targeted execution [skip ci]"
          git push
