name: Format Step32

on:
  push:
    branches:
      - feature/step32-final-validation

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project tooling
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Format
        run: python -m ruff check . --fix && python -m ruff format .
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format step32 validation changes [skip ci]"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/format-step32.yml
          git commit -m "chore: remove temporary formatting workflow [skip ci]"
          git push
