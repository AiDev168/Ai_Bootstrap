name: Step32 fixture repair

on:
  push:
    branches:
      - feature/step32-final-validation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/unit/test_action_instance_isolation.py")
          text = path.read_text(encoding="utf-8")
          old = "action_results=[],\n            )"
          new = "action_results=[SimpleNamespace(is_success=True, results=[])],\n                    pipeline_result=SimpleNamespace(verification_result=[]),\n                )"
          if old not in text:
              raise SystemExit("fixture pattern not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_action_instance_isolation.py .github/workflows/step32-fix-test-fixture.yml
          git commit -m "test: model successful targeted bootstrap result [skip ci]"
          git rm .github/workflows/step32-fix-test-fixture.yml
          git commit -m "chore: remove one-time fixture workflow [skip ci]"
          git push
