name: One-time runtime finalize

on:
  push:
    branches:
      - feature/step32-final-validation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install project tooling
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Apply runtime fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/ai_engineering_bootstrap/pipeline/engine.py",
              "        return True\n\n\nclass PipelineEngine:",
              '''        return True\n\n    @property\n    def action_successful(self) -> bool:\n        """Return true when requested actions executed and verified successfully."""\n        if self.execution_result is None or not self.validation_result.is_valid:\n            return False\n        if self.is_pending_approval or self.is_rejected_approval:\n            return False\n        if not self.execution_result.is_success:\n            return False\n        return not any(\n            getattr(item, "status", None).value == "failed"\n            for item in (self.verification_result or [])\n        )\n\n\nclass PipelineEngine:''',
          )
          replace_once(
              "src/ai_engineering_bootstrap/bootstrap/service.py",
              '''    @property\n    def is_success(self) -> bool:\n        """Return true only when the environment is development-ready."""''',
              '''    @property\n    def requested_actions_successful(self) -> bool:\n        """Return true when all executed requested actions succeeded."""\n        return all(result.is_success for result in self.action_results)\n\n    @property\n    def is_success(self) -> bool:\n        """Return true only when the environment is development-ready."""''',
          )
          replace_once(
              "src/ai_engineering_bootstrap/bootstrap/service.py",
              "            if not result.is_success:\n                break\n",
              "            if not result.action_successful:\n                break\n",
          )
          replace_once(
              "src/ai_engineering_bootstrap/backend/session_service.py",
              '''                    ExecutionEvidence(\n                        action_id=action_result.action_id,\n                        success=action_result.status.value == "success",\n                        output=action_result.message,\n                        error=None\n                        if action_result.status.value == "success"\n                        else action_result.message,\n                    )''',
              '''                    ExecutionEvidence(\n                        action_id=action_result.action_id,\n                        success=action_result.status.value == "success",\n                        output=action_result.message,\n                        error=None\n                        if action_result.status.value == "success"\n                        else action_result.message,\n                        artifacts=dict(action_result.details),\n                    )''',
          )
          replace_once(
              "src/ai_engineering_bootstrap/backend/session_service.py",
              '''        session.status = (\n            SessionStatus.COMPLETED if result.is_success else SessionStatus.FAILED\n        )\n        session.completed_at = utcnow()\n        session.add_event(\n            "session_completed" if result.is_success else "session_failed",\n            "Session execution completed."\n            if result.is_success\n            else "Session execution failed.",\n            {\n                "environment_ready": result.environment_ready,\n                "excluded_actions": excluded_actions,\n            },\n        )''',
              '''        requested_actions_successful = result.requested_actions_successful\n        session.status = (\n            SessionStatus.COMPLETED\n            if requested_actions_successful\n            else SessionStatus.FAILED\n        )\n        session.completed_at = utcnow()\n        session.add_event(\n            "session_completed" if requested_actions_successful else "session_failed",\n            "Requested installation actions completed successfully."\n            if requested_actions_successful\n            else "One or more requested actions failed during execution.",\n            {\n                "environment_ready": result.environment_ready,\n                "requested_actions_successful": requested_actions_successful,\n                "executed_actions": [action.action_id for action in execution_actions],\n                "excluded_actions": excluded_actions,\n            },\n        )''',
          )
          replace_once(
              "src/ai_engineering_bootstrap/backend/session_service.py",
              '''            "session_id": session.session_id,\n            "status": session.status.value,\n            "created_at": session.created_at.isoformat(),''',
              '''            "session_id": session.session_id,\n            "label": session.request.natural_language_goal.strip()\n            if session.request and session.request.natural_language_goal.strip()\n            else "Environment Bootstrap",\n            "status": session.status.value,\n            "created_at": session.created_at.isoformat(),''',
          )

          llm = Path("src/ai_engineering_bootstrap/backend/llm_settings.py")
          text = llm.read_text(encoding="utf-8")
          text = text.replace(
              "from pathlib import Path\n",
              "from datetime import UTC, datetime\nfrom pathlib import Path\n",
              1,
          )
          text = text.replace(
              '''    enabled: bool = False\n''',
              '''    enabled: bool = False\n    connection_ok: bool | None = None\n    connection_message: str = "Not tested yet."\n    last_test_at: str | None = None\n''',
              1,
          )
          text = text.replace(
              '''    def __init__(self, store: LLMSettingsStore | None = None) -> None:\n        self.store = store or LLMSettingsStore()\n''',
              '''    def __init__(self, store: LLMSettingsStore | None = None) -> None:\n        self.store = store or LLMSettingsStore()\n        self._last_probe: dict[str, Any] | None = None\n''',
              1,
          )
          text = text.replace(
              '''        enabled = provider != "mock" and bool(model or base_url)\n''',
              '''        enabled = provider == "mock" or bool(model or base_url)\n''',
              1,
          )
          text = text.replace(
              '''        return LLMSettings(\n            provider=provider,\n            model=model,\n            base_url=base_url,\n            api_key_configured=bool(api_key),\n            enabled=enabled,\n        )\n''',
              '''        connection_ok = None\n        connection_message = "Not tested yet."\n        last_test_at = None\n        probe = self._last_probe\n        if probe and probe.get("fingerprint") == self._fingerprint(values):\n            connection_ok = bool(probe.get("ok"))\n            connection_message = str(probe.get("message", ""))\n            last_test_at = probe.get("tested_at")\n        return LLMSettings(\n            provider=provider,\n            model=model,\n            base_url=base_url,\n            api_key_configured=bool(api_key),\n            enabled=enabled,\n            connection_ok=connection_ok,\n            connection_message=connection_message,\n            last_test_at=last_test_at,\n        )\n''',
              1,
          )
          text = text.replace(
              '''    def update(self, payload: dict[str, Any]) -> LLMSettings:\n        current = self.store.load()\n        values = self._normalize_values(payload, current)\n        self.store.save(values)\n        return self.get()\n''',
              '''    @staticmethod\n    def _fingerprint(values: dict[str, str]) -> tuple[str, str, str, bool]:\n        return (\n            values.get("provider", DEFAULT_PROVIDER),\n            values.get("model", ""),\n            values.get("base_url", ""),\n            bool(values.get("api_key", "")),\n        )\n\n    def _record_probe(self, values: dict[str, str], result: dict[str, Any]) -> dict[str, Any]:\n        self._last_probe = {\n            "fingerprint": self._fingerprint(values),\n            "ok": bool(result.get("ok")),\n            "message": str(result.get("message", "")),\n            "tested_at": datetime.now(UTC).isoformat(),\n        }\n        return result\n\n    def update(self, payload: dict[str, Any]) -> LLMSettings:\n        current = self.store.load()\n        values = self._normalize_values(payload, current)\n        self.store.save(values)\n        self._last_probe = None\n        return self.get()\n''',
              1,
          )
          text = text.replace(
              '''        if provider == "mock":\n            return {\n                "ok": False,\n                "provider": provider,\n                "message": "Mock provider is test-only and is not a runtime LLM.",\n            }\n''',
              '''        if provider == "mock":\n            return self._record_probe(\n                values,\n                {\n                    "ok": True,\n                    "provider": provider,\n                    "message": "Mock provider is available offline.",\n                },\n            )\n''',
              1,
          )
          llm.write_text(text, encoding="utf-8")

          backend = Path("src/ai_engineering_bootstrap/backend/service.py")
          text = backend.read_text(encoding="utf-8")
          text = text.replace('"llm_available": settings.enabled,', '"llm_available": settings.connection_ok is True,', 1)
          text = text.replace(
              '''                    "enabled": settings.enabled,\n''',
              '''                    "enabled": settings.enabled,\n                    "connection_ok": settings.connection_ok,\n                    "connection_message": settings.connection_message,\n                    "last_test_at": settings.last_test_at,\n''',
              1,
          )
          backend.write_text(text, encoding="utf-8")

          # Speed up one pure GUI contract by injecting a trivial audit source.
          test = Path("tests/unit/test_gui_backend_contract.py")
          text = test.read_text(encoding="utf-8")
          text = text.replace(
              'from ai_engineering_bootstrap.backend.service import ApplicationBackend\n',
              'from types import SimpleNamespace\n\nfrom ai_engineering_bootstrap.backend.service import ApplicationBackend\nfrom ai_engineering_bootstrap.backend.session_service import EnvironmentSessionService\nfrom ai_engineering_bootstrap.environment.session_repository import InMemorySessionRepository\n',
              1,
          )
          text = text.replace(
              '''def test_session_endpoints_return_serializable_data() -> None:\n    backend = ApplicationBackend()\n''',
              '''def test_session_endpoints_return_serializable_data() -> None:\n    service = EnvironmentSessionService(\n        repository=InMemorySessionRepository(),\n        audit_factory=lambda: SimpleNamespace(checks=[]),\n    )\n    backend = ApplicationBackend(session_service=service)\n''',
              1,
          )
          test.write_text(text, encoding="utf-8")

          # Append browser diagnostics: pause/latest, filters, red errors, friendly session label.
          runtime = Path("src/ai_engineering_bootstrap/gui/static/app-runtime.js")
          runtime.write_text(
              runtime.read_text(encoding="utf-8")
              + '''\n\n(() => {\n    const consoleLog = document.getElementById("request-log");\n    const latest = document.getElementById("latest");\n    const consoleToolbar = document.querySelector("#console .toolbar");\n    let latestPaused = false;\n    let pausedLatestText = null;\n    let requestFilter = "ALL";\n\n    function applyRequestFilter() {\n        if (!consoleLog) return;\n        for (const item of consoleLog.querySelectorAll(".request")) {\n            const method = item.querySelector("strong")?.textContent?.trim() || "";\n            const isError = item.classList.contains("bad");\n            item.style.display = requestFilter === "ALL"\n                || method === requestFilter\n                || (requestFilter === "ERROR" && isError) ? "block" : "none";\n        }\n    }\n\n    function refreshLatest() {\n        if (!latest) return;\n        const newest = consoleLog?.querySelector(".request");\n        latest.classList.toggle("error-box", Boolean(newest?.classList.contains("bad")));\n        if (latestPaused && pausedLatestText !== null && latest.textContent !== pausedLatestText) {\n            latest.textContent = pausedLatestText;\n        }\n    }\n\n    function ensureControls() {\n        if (!consoleToolbar || consoleToolbar.querySelector("[data-console-controls]")) return;\n        const controls = document.createElement("div");\n        controls.dataset.consoleControls = "1";\n        controls.style.display = "flex";\n        controls.style.gap = "8px";\n        controls.innerHTML = '<select id="request-filter" style="width:auto"><option value="ALL">All</option><option value="GET">GET</option><option value="POST">POST</option><option value="ERROR">Errors</option></select><button id="pause-latest" class="secondary" type="button">Pause</button>';\n        consoleToolbar.appendChild(controls);\n        document.getElementById("request-filter")?.addEventListener("change", event => {\n            requestFilter = event.target.value;\n            applyRequestFilter();\n        });\n        document.getElementById("pause-latest")?.addEventListener("click", event => {\n            latestPaused = !latestPaused;\n            pausedLatestText = latestPaused ? (latest?.textContent ?? "") : null;\n            event.target.textContent = latestPaused ? "Resume" : "Pause";\n            refreshLatest();\n        });\n    }\n\n    const observer = new MutationObserver(() => {\n        ensureControls();\n        applyRequestFilter();\n        refreshLatest();\n    });\n    if (consoleLog) observer.observe(consoleLog, {childList: true, subtree: true});\n    if (latest) observer.observe(latest, {childList: true, characterData: true, subtree: true});\n    ensureControls();\n    applyRequestFilter();\n    refreshLatest();\n})();\n''',
              encoding="utf-8",
          )
          PY
      - name: Format
        run: python -m ruff format .
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Targeted tests
        run: pytest -q tests/unit/test_gui_backend_contract.py tests/unit/test_runtime_session_service.py tests/unit/test_step32_installation_intent.py tests/unit/test_backend_service_boundary_step31.py
      - name: Full regression
        run: pytest -q
      - name: Diff check
        run: git diff --check
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/one-time-runtime-finalize.yml
          git rm .github/workflows/one-time-runtime-finalize.yml
          git commit -m "chore: finalize step32 runtime fixes [skip ci]"
          git push
