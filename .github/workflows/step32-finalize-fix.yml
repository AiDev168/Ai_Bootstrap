name: Step32 final targeted fix

on:
  push:
    branches:
      - feature/step32-final-validation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Pattern not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/ai_engineering_bootstrap/backend/service.py",
              '"llm_available": settings.enabled,\n                "llm": {',
              '"llm_available": settings.connection_ok is True,\n                "llm": {',
          )
          replace_once(
              "src/ai_engineering_bootstrap/backend/service.py",
              '"enabled": settings.enabled,\n                },',
              '"enabled": settings.enabled,\n                    "connection_ok": settings.connection_ok,\n                    "connection_message": settings.connection_message,\n                },',
          )
          replace_once(
              "src/ai_engineering_bootstrap/backend/service.py",
              '"enabled": settings.enabled,\n            }',
              '"enabled": settings.enabled,\n                "connection_ok": settings.connection_ok,\n                "connection_message": settings.connection_message,\n            }',
          )

          p = Path("src/ai_engineering_bootstrap/backend/session_service.py")
          text = p.read_text(encoding="utf-8")
          old = '''        session.status = (\n            SessionStatus.COMPLETED if result.is_success else SessionStatus.FAILED\n        )\n        session.completed_at = utcnow()\n        session.add_event(\n            "session_completed" if result.is_success else "session_failed",\n            "Session execution completed."\n            if result.is_success\n            else "Session execution failed.",\n            {\n                "environment_ready": result.environment_ready,\n                "excluded_actions": excluded_actions,\n            },\n        )\n'''
          new = '''        targeted_success = bool(result.action_results) and all(\n            item.is_success for item in result.action_results\n        )\n        pipeline_result = getattr(result, "pipeline_result", None)\n        verification_results = (\n            tuple(pipeline_result.verification_result)\n            if pipeline_result is not None\n            and getattr(pipeline_result, "verification_result", None) is not None\n            else ()\n        )\n        if any(\n            getattr(item.status, "value", None) == "failed"\n            for item in verification_results\n        ):\n            targeted_success = False\n        session.status = (\n            SessionStatus.COMPLETED if targeted_success else SessionStatus.FAILED\n        )\n        session.completed_at = utcnow()\n        execution_evidence = [\n            {\n                "action_id": item.action_id,\n                "status": item.status.value,\n                "message": item.message,\n                "details": dict(item.details),\n            }\n            for execution in result.action_results\n            for item in execution.results\n        ]\n        verification_evidence = [\n            {\n                "action_id": item.action_id,\n                "status": item.status.value,\n                "message": item.message,\n                "expected": item.expected,\n                "observed": item.observed,\n                "details": dict(item.details),\n            }\n            for item in verification_results\n        ]\n        session.add_event(\n            "session_completed" if targeted_success else "session_failed",\n            "Session execution completed."\n            if targeted_success\n            else "Session execution failed.",\n            {\n                "environment_ready": result.environment_ready,\n                "targeted_success": targeted_success,\n                "excluded_actions": excluded_actions,\n                "execution": execution_evidence,\n                "verification": verification_evidence,\n            },\n        )\n'''
          if old not in text:
              raise SystemExit("session completion block not found")
          text = text.replace(old, new, 1)
          old = '"environment_ready": result.environment_ready,\n                "rejected_actions": excluded_actions + list(result.rejected_actions),'
          new = '"environment_ready": result.environment_ready,\n                "targeted_success": targeted_success,\n                "execution": execution_evidence,\n                "verification": verification_evidence,\n                "rejected_actions": excluded_actions + list(result.rejected_actions),'
          if old not in text:
              raise SystemExit("session response block not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

          p = Path("src/ai_engineering_bootstrap/gui/static/app-runtime.js")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              '<option value="ALL">All</option><option value="GET">GET</option><option value="POST">POST</option>',
              '<option value="ALL">All</option><option value="GET">GET</option><option value="POST">POST</option><option value="ERROR">Errors</option>',
              1,
          )
          text = text.replace(
              'const rows = state.requests.filter((item) => filter === "ALL" || item.method === filter);',
              'const rows = state.requests.filter((item) => filter === "ALL" || (filter === "ERROR" ? !(item.status >= 200 && item.status < 300) : item.method === filter));',
              1,
          )
          text = text.replace(
              '.filter((input) => input.id !== "force-install")',
              '.filter(input => input.id !== "force-install")',
          )
          marker = '    const originalLoadSessions = window.loadSessions;\n'
          injection = '''    const originalCreateSession = window.createSession;\n    if (typeof originalCreateSession === "function") {\n        window.createSession = async function createSessionRuntime() {\n            const goal = document.getElementById("goal")?.value.trim() || "";\n            const projectPath = document.getElementById("project-path")?.value.trim() || null;\n            const forceInstall = Boolean(document.getElementById("force-install")?.checked);\n            if (!goal) {\n                if (typeof window.showError === "function") window.showError("Enter an environment goal first.");\n                return null;\n            }\n            const button = document.getElementById("create-btn");\n            if (button) { button.disabled = true; button.textContent = "Creating…"; }\n            try {\n                const payload = {\n                    natural_language_goal: goal,\n                    project_path: projectPath,\n                    required_tools: typeof window.selectedTools === "function" ? window.selectedTools() : [],\n                    optional_tools: [],\n                    project_dependencies: [],\n                    constraints: forceInstall ? { force_install: true } : {}\n                };\n                const created = await window.api("/sessions", "POST", payload);\n                window.state.sessionId = created.session_id;\n                if (typeof window.openTab === "function") window.openTab("sessions");\n                if (typeof window.loadSessions === "function") await window.loadSessions();\n                if (typeof window.viewSession === "function") await window.viewSession(created.session_id);\n                return created;\n            } catch (error) {\n                if (typeof window.showError === "function") window.showError(error.message);\n                return null;\n            } finally {\n                if (button) { button.disabled = false; button.textContent = "Create Session"; }\n            }\n        };\n    }\n\n'''
          if marker not in text:
              raise SystemExit("createSession marker not found")
          p.write_text(text.replace(marker, injection + marker, 1), encoding="utf-8")

          test_path = Path("tests/unit/test_action_instance_isolation.py")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace(
              '                    action_results=[],\n                )',
              '                    action_results=[SimpleNamespace(is_success=True, results=[])],\n                    pipeline_result=SimpleNamespace(verification_result=[]),\n                )',
              1,
          )
          test_path.write_text(test, encoding="utf-8")
          PY
      - name: Format and validate
        run: |
          python -m ruff check . --fix
          python -m ruff format .
          python -m ruff check .
          python -m ruff format --check .
          python -m compileall -q src tests
          pytest -q
      - name: Commit and clean up workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows
          git rm .github/workflows/step32-runtime-gui-fix.yml .github/workflows/step32-finalize-fix.yml
          git commit -m "fix: complete targeted session execution and gui controls [skip ci]"
          git push
