name: Step32 Runtime Fix

on:
  push:
    branches:
      - feature/step32-final-validation

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.head_commit.message != 'chore: finalize step32 runtime fixes [one-time]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Apply runtime fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) Pipeline success must reflect requested action execution/verification,
          # not the unrelated global readiness of the whole machine.
          replace_once(
              "src/ai_engineering_bootstrap/pipeline/engine.py",
              "        return True\n\n\nclass PipelineEngine:",
              '''        return True\n\n    @property\n    def action_successful(self) -> bool:\n        """Return true when this plan's requested actions executed and verified."""\n        if self.execution_result is None or not self.validation_result.is_valid:\n            return False\n        if self.is_pending_approval or self.is_rejected_approval:\n            return False\n        if not self.execution_result.is_success:\n            return False\n        return not any(\n            getattr(item, "status", None).value == "failed"\n            for item in (self.verification_result or [])\n        )\n\n\nclass PipelineEngine:''',
          )

          # 2) Bootstrap loop continues after a requested action succeeds even if
          # the machine as a whole is not yet development-ready.
          replace_once(
              "src/ai_engineering_bootstrap/bootstrap/service.py",
              '''    @property\n    def is_success(self) -> bool:\n        """Return true only when the environment is development-ready."""''',
              '''    @property\n    def requested_actions_successful(self) -> bool:\n        """Return true when all requested action executions succeeded."""\n        return bool(self.action_results) and all(\n            result.is_success for result in self.action_results\n        )\n\n    @property\n    def is_success(self) -> bool:\n        """Return true only when the environment is development-ready."""''',
          )
          replace_once(
              "src/ai_engineering_bootstrap/bootstrap/service.py",
              "            if not result.is_success:\n                break\n",
              "            if not result.action_successful:\n                break\n",
          )

          # 3) GUI Session status tracks the requested work, not unrelated global
          # readiness. Preserve detailed execution evidence for the UI.
          replace_once(
              "src/ai_engineering_bootstrap/backend/session_service.py",
              '''                    ExecutionEvidence(\n                        action_id=action_result.action_id,\n                        success=action_result.status.value == "success",\n                        output=action_result.message,\n                        error=None\n                        if action_result.status.value == "success"\n                        else action_result.message,\n                    )''',
              '''                    ExecutionEvidence(\n                        action_id=action_result.action_id,\n                        success=action_result.status.value == "success",\n                        output=action_result.message,\n                        error=None\n                        if action_result.status.value == "success"\n                        else action_result.message,\n                        artifacts={"details": dict(action_result.details)},\n                    )''',
          )
          replace_once(
              "src/ai_engineering_bootstrap/backend/session_service.py",
              '''        session.status = (\n            SessionStatus.COMPLETED if result.is_success else SessionStatus.FAILED\n        )''',
              '''        requested_actions_successful = result.requested_actions_successful\n        session.status = (\n            SessionStatus.COMPLETED\n            if requested_actions_successful\n            else SessionStatus.FAILED\n        )''',
          )
          replace_once(
              "src/ai_engineering_bootstrap/backend/session_service.py",
              '''            "session_completed" if result.is_success else "session_failed",\n            "Session execution completed."\n            if result.is_success\n            else "Session execution failed.",''',
              '''            "session_completed" if requested_actions_successful else "session_failed",\n            "Requested actions executed successfully."\n            if requested_actions_successful\n            else "One or more requested actions failed during execution.",''',
          )
          replace_once(
              "src/ai_engineering_bootstrap/backend/session_service.py",
              '''                "environment_ready": result.environment_ready,\n                "excluded_actions": excluded_actions,''',
              '''                "environment_ready": result.environment_ready,\n                "requested_actions_successful": requested_actions_successful,\n                "excluded_actions": excluded_actions,''',
          )

          # 4) Make LLM health mean connection health, not merely "configured".
          llm = Path("src/ai_engineering_bootstrap/backend/llm_settings.py")
          text = llm.read_text(encoding="utf-8")
          text = text.replace("from pathlib import Path\n", "from pathlib import Path\nfrom datetime import UTC, datetime\n", 1)
          text = text.replace(
              '''    enabled: bool = False\n''',
              '''    enabled: bool = False\n    connection_ok: bool | None = None\n    connection_message: str = ""\n    last_test_at: str | None = None\n''',
              1,
          )
          text = text.replace(
              '''    def __init__(self, store: LLMSettingsStore | None = None) -> None:\n        self.store = store or LLMSettingsStore()\n''',
              '''    def __init__(self, store: LLMSettingsStore | None = None) -> None:\n        self.store = store or LLMSettingsStore()\n        self._last_probe: dict[str, Any] | None = None\n''',
              1,
          )
          text = text.replace(
              '''        enabled = provider != "mock" and bool(model or base_url)\n''',
              '''        enabled = provider == "mock" or bool(model or base_url)\n''',
              1,
          )
          text = text.replace(
              '''        return LLMSettings(\n            provider=provider,\n            model=model,\n            base_url=base_url,\n            api_key_configured=bool(api_key),\n            enabled=enabled,\n        )\n''',
              '''        connection = self._last_probe\n        connection_ok = None\n        connection_message = "Not tested yet."\n        last_test_at = None\n        if connection and connection.get("fingerprint") == self._fingerprint(values):\n            connection_ok = bool(connection.get("ok"))\n            connection_message = str(connection.get("message", ""))\n            last_test_at = connection.get("tested_at")\n        return LLMSettings(\n            provider=provider,\n            model=model,\n            base_url=base_url,\n            api_key_configured=bool(api_key),\n            enabled=enabled,\n            connection_ok=connection_ok,\n            connection_message=connection_message,\n            last_test_at=last_test_at,\n        )\n''',
              1,
          )
          text = text.replace(
              '''    def update(self, payload: dict[str, Any]) -> LLMSettings:\n        current = self.store.load()\n        values = self._normalize_values(payload, current)\n        self.store.save(values)\n        return self.get()\n''',
              '''    @staticmethod\n    def _fingerprint(values: dict[str, str]) -> tuple[str, str, str, bool]:\n        return (\n            values.get("provider", DEFAULT_PROVIDER),\n            values.get("model", ""),\n            values.get("base_url", ""),\n            bool(values.get("api_key", "")),\n        )\n\n    def _record_probe(self, values: dict[str, str], result: dict[str, Any]) -> dict[str, Any]:\n        self._last_probe = {\n            "fingerprint": self._fingerprint(values),\n            "ok": bool(result.get("ok")),\n            "message": str(result.get("message", "")),\n            "tested_at": datetime.now(UTC).isoformat(),\n        }\n        return result\n\n    def update(self, payload: dict[str, Any]) -> LLMSettings:\n        current = self.store.load()\n        values = self._normalize_values(payload, current)\n        self.store.save(values)\n        self._last_probe = None\n        return self.get()\n''',
              1,
          )
          text = text.replace(
              '''        if provider == "mock":\n            return {\n                "ok": False,\n                "provider": provider,\n                "message": "Mock provider is test-only and is not a runtime LLM.",\n            }\n''',
              '''        if provider == "mock":\n            return self._record_probe(\n                values,\n                {\n                    "ok": True,\n                    "provider": provider,\n                    "message": "Mock provider is available offline.",\n                },\n            )\n''',
              1,
          )
          llm.write_text(text, encoding="utf-8")

          # 5) Backend exposes connection health separately from configuration.
          service = Path("src/ai_engineering_bootstrap/backend/service.py")
          text = service.read_text(encoding="utf-8")
          old = '''        return BackendResult(\n            {\n                "status": "ok",\n                "version": self.VERSION,\n                "llm_available": settings.enabled,\n                "llm": {\n                    "provider": settings.provider,\n                    "model": settings.model,\n                    "base_url": settings.base_url,\n                    "api_key_configured": settings.api_key_configured,\n                    "enabled": settings.enabled,\n                },\n            }\n        )'''
          new = '''        return BackendResult(\n            {\n                "status": "ok",\n                "version": self.VERSION,\n                "llm_available": settings.connection_ok is True,\n                "llm": {\n                    "provider": settings.provider,\n                    "model": settings.model,\n                    "base_url": settings.base_url,\n                    "api_key_configured": settings.api_key_configured,\n                    "enabled": settings.enabled,\n                    "connection_ok": settings.connection_ok,\n                    "connection_message": settings.connection_message,\n                    "last_test_at": settings.last_test_at,\n                },\n            }\n        )'''
          if old not in text:
              raise SystemExit("health contract anchor not found")
          service.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 6) Speed up GUI backend contract tests by avoiding real audit probes in the
          # pure serialization test. Other end-to-end tests still cover the real path.
          test = Path("tests/unit/test_gui_backend_contract.py")
          text = test.read_text(encoding="utf-8")
          text = text.replace("from ai_engineering_bootstrap.backend.service import ApplicationBackend\n", "from types import SimpleNamespace\n\nfrom ai_engineering_bootstrap.backend.service import ApplicationBackend\nfrom ai_engineering_bootstrap.backend.session_service import EnvironmentSessionService\nfrom ai_engineering_bootstrap.environment.session_repository import InMemorySessionRepository\n", 1)
          text = text.replace(
              '''def test_session_endpoints_return_serializable_data() -> None:\n    backend = ApplicationBackend()\n''',
              '''def test_session_endpoints_return_serializable_data() -> None:\n    audit = SimpleNamespace(checks=[])\n    service = EnvironmentSessionService(\n        repository=InMemorySessionRepository(),\n        audit_factory=lambda: audit,\n    )\n    backend = ApplicationBackend(session_service=service)\n''',
              1,
          )
          test.write_text(text, encoding="utf-8")
          PY

          # 7) Add GUI runtime controls without rewriting the large static HTML.
          cat >> src/ai_engineering_bootstrap/gui/static/app-runtime.js <<'JS'

(() => {
    const consoleLog = document.getElementById("request-log");
    const latest = document.getElementById("latest");
    const consoleToolbar = document.querySelector("#console .toolbar");
    const sessionDetail = document.getElementById("session-detail");
    let latestPaused = false;
    let pausedLatestText = null;
    let requestFilter = "ALL";
    let wrappingApi = false;

    function ensureConsoleControls() {
        if (!consoleToolbar || consoleToolbar.querySelector("[data-console-controls]")) {
            return;
        }
        const controls = document.createElement("div");
        controls.dataset.consoleControls = "1";
        controls.style.display = "flex";
        controls.style.gap = "8px";
        controls.innerHTML = '<select id="request-filter" style="width:auto"><option value="ALL">All</option><option value="GET">GET</option><option value="POST">POST</option><option value="ERROR">Errors</option></select><button id="pause-latest" class="secondary" type="button">Pause</button>';
        consoleToolbar.appendChild(controls);
        const filter = document.getElementById("request-filter");
        const pause = document.getElementById("pause-latest");
        filter?.addEventListener("change", () => {
            requestFilter = filter.value;
            applyRequestFilter();
        });
        pause?.addEventListener("click", () => {
            latestPaused = !latestPaused;
            if (latestPaused) {
                pausedLatestText = latest?.textContent ?? "";
                pause.textContent = "Resume";
            } else {
                pause.textContent = "Pause";
            }
            refreshLatestState();
        });
    }

    function applyRequestFilter() {
        if (!consoleLog) return;
        for (const item of consoleLog.querySelectorAll(".request")) {
            const method = item.querySelector("strong")?.textContent?.trim() || "";
            const isError = item.classList.contains("bad");
            const visible = requestFilter === "ALL"
                || method === requestFilter
                || (requestFilter === "ERROR" && isError);
            item.style.display = visible ? "block" : "none";
        }
    }

    function refreshLatestState() {
        if (!latest) return;
        latest.classList.toggle("error-box", latest.textContent.includes('"error"'));
        if (latestPaused && pausedLatestText !== null && latest.textContent !== pausedLatestText) {
            latest.textContent = pausedLatestText;
        }
    }

    function replaceSessionIdInDetail(session) {
        if (!sessionDetail || !session?.session_id) return;
        const label = session.request?.natural_language_goal?.trim()
            || session.label
            || `Session for ${session.request?.project_path || "environment"}`;
        const walker = document.createTreeWalker(sessionDetail, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        for (const node of nodes) {
            if (node.nodeValue?.includes(session.session_id)) {
                node.nodeValue = node.nodeValue.split(session.session_id).join(label);
            }
        }
    }

    const currentApi = window.api;
    if (typeof currentApi === "function" && !wrappingApi) {
        wrappingApi = true;
        window.api = async function apiWithConsoleControls(...args) {
            const before = latest?.textContent ?? "";
            const result = await currentApi(...args);
            if (latestPaused) {
                pausedLatestText = pausedLatestText ?? before;
                if (latest) latest.textContent = pausedLatestText;
            }
            refreshLatestState();
            applyRequestFilter();
            return result;
        };
    }

    const currentRenderSession = window.renderSession;
    if (typeof currentRenderSession === "function") {
        window.renderSession = function renderSessionWithStableLabels(...args) {
            const result = currentRenderSession(...args);
            replaceSessionIdInDetail(args[0]);
            return result;
        };
    }

    ensureConsoleControls();
    applyRequestFilter();
    refreshLatestState();
})();
JS
          PY
      - name: Ruff check
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Targeted execution and GUI tests
        run: |
          pytest -q tests/unit/test_gui_backend_contract.py tests/unit/test_backend_service_boundary_step31.py tests/unit/test_step32_installation_intent.py tests/unit/test_real_execution.py
      - name: Full regression
        run: pytest -q
      - name: Diff check
        run: git diff --check
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/step32-runtime-fix.yml
          git rm .github/workflows/step32-runtime-fix.yml
          git commit -m "fix: stabilize runtime execution and gui diagnostics [one-time]"
          git push
