<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Engineering Bootstrap</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#e8ecf4}
body{margin:0;background:linear-gradient(135deg,#0b1020,#131a2d);min-height:100vh}
main{max-width:1200px;margin:0 auto;padding:28px}
h1{margin:0 0 8px;font-size:28px}.muted{color:#95a1b5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:20px 0}.card{background:#151d32;border:1px solid #26324d;border-radius:16px;padding:18px;box-shadow:0 12px 30px #0003}.value{font-size:30px;font-weight:700;margin-top:10px}.ok{color:#61d095}.bad{color:#ff7d87}.warn{color:#f7c66b}button{background:#5c7cfa;color:white;border:0;border-radius:10px;padding:11px 15px;cursor:pointer;margin-right:8px}button:hover{filter:brightness(1.08)}pre{white-space:pre-wrap;background:#0a0f1d;padding:14px;border-radius:10px;overflow:auto;max-height:420px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:10px;border-bottom:1px solid #28344e;text-align:left;font-size:14px}
</style>
</head>
<body>
<main>
<h1>AI Engineering Bootstrap</h1>
<div class="muted">Stable backend + controlled execution dashboard</div>
<div class="grid">
<div class="card"><div class="muted">Health score</div><div id="score" class="value">—</div></div>
<div class="card"><div class="muted">Development ready</div><div id="ready" class="value">—</div></div>
<div class="card"><div class="muted">Cursor</div><div id="cursor" class="value">—</div></div>
<div class="card"><div class="muted">Plan actions</div><div id="actions" class="value">—</div></div>
</div>
<div class="card">
<button onclick="refreshAll()">Refresh</button>
<button onclick="runSafe()">Run Safe Preview</button>
</div>
<div class="grid">
<div class="card"><h3>Audit</h3><div id="audit"></div></div>
<div class="card"><h3>Engineering Environment</h3><div id="engineering"></div></div>
</div>
<div class="card"><h3>Plan</h3><div id="plan"></div></div>
<div class="card"><h3>Safe Run / Evidence</h3><pre id="run">—</pre></div>
</main>
<script>
const get=async p=>(await fetch(p)).json();
function status(v){return v==='passed'||v==='available'||v===true?'<span class="ok">OK</span>':v==='failed'?'<span class="bad">FAILED</span>':'<span class="warn">'+v+'</span>'}
async function refreshAll(){
 const [a,p,e]=await Promise.all([get('/api/v1/audit'),get('/api/v1/plan'),get('/api/v1/engineering')]);
 document.getElementById('score').textContent=a.readiness.health_score+'/100';
 document.getElementById('ready').innerHTML=status(a.readiness.development_ready);
 document.getElementById('cursor').innerHTML=e.cursor_available?'<span class="ok">AVAILABLE</span>':'<span class="bad">MISSING</span>';
 document.getElementById('actions').textContent=p.actions.length;
 document.getElementById('audit').innerHTML='<table><tr><th>Check</th><th>Status</th><th>Details</th></tr>'+a.checks.map(c=>`<tr><td>${c.name}</td><td>${status(c.status)}</td><td>${c.details||''}</td></tr>`).join('')+'</table>';
 document.getElementById('engineering').innerHTML='<table><tr><th>Tool</th><th>State</th><th>Path</th></tr>'+e.tools.map(t=>`<tr><td>${t.name}</td><td>${t.available?'<span class="ok">AVAILABLE</span>':'<span class="bad">MISSING</span>'}</td><td>${t.path||''}</td></tr>`).join('')+'</table>';
 document.getElementById('plan').innerHTML=p.actions.length?'<table><tr><th>Action</th><th>Description</th><th>Priority</th></tr>'+p.actions.map(x=>`<tr><td>${x.action_id}</td><td>${x.description}</td><td>${x.priority}</td></tr>`).join('')+'</table>':'<span class="ok">No actions required.</span>';
}
async function runSafe(){document.getElementById('run').textContent=JSON.stringify(await (await fetch('/api/v1/run-safe',{method:'POST'})).json(),null,2);await refreshAll()}
refreshAll();
</script>
</body>
</html>
